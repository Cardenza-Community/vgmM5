[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.14
board_build.arduino.memory_type = qio_opi
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -D IS_ATOMS3
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wdouble-promotion
    -D BOARD_HAS_PSRAM
    -O3
    -funroll-loops
    -fno-exceptions
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions_atoms3.csv
board_build.filesystem = ffat

[env:m5stack-cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.14
    m5stack/M5Cardputer@^1.1.1
build_flags =
    -D IS_CARDPUTER=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = fatfs
board_build.embed_txtfiles =
    src/albums.bin
    src/tracks.bin
    src/strings.bin
    src/companies.bin
    src/composers.bin
    src/systems.bin

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.14
build_flags =
    -D IS_CORES3=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wdouble-promotion
    -D BOARD_HAS_PSRAM
    -D YM2203_DIAG_SOLO_FNUM=1
    -O3
    -funroll-loops
    -fno-exceptions
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_16MB.csv
board_build.filesystem = fatfs
board_build.embed_files =
    logo.png
    play.png
    stop.png
    up.png
    down.png
    auto.png
    back.png
    forward.png

; Cardenza has original Cardputer matrix/display, ES8156 output and internal RAM.
[env:cardenza]
extends = env:m5stack-cardputer
platform = espressif32@6.7.0
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.embed_txtfiles =
build_flags =
    ${env:m5stack-cardputer.build_flags}
    -DCARDENZA
    -DCARDENZA_TARGET
    -Wl,--wrap=esp_partition_erase_range
    -Wl,--wrap=_ZN2m511Power_Class5beginEv
    -Wl,--wrap=_ZN2m59M5Unified10_setup_ledEN4lgfx6boards7board_tE
    -DCARDENZA_OFFLINE
lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.22
    m5stack/M5GFX@0.2.31
